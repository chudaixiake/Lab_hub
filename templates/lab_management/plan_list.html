{% extends 'base.html' %}

{% block title %}日常计划{% endblock %}

{% block content %}
<h1 style="margin-bottom: 2rem; color: #333;">📋 日常计划</h1>

{% for plan in plans %}
<div class="plan-item">
    <div class="plan-header">
        <span class="plan-user">{{ plan.user.username }}</span>
        <span class="plan-date">{{ plan.date }}</span>
    </div>
    <div class="plan-content">{{ plan.content }}</div>
    <span class="plan-status {% if plan.is_completed %}status-completed{% else %}status-pending{% endif %}">
        {% if plan.is_completed %}✓ 已完成{% else %}⏳ 进行中{% endif %}
    </span>
</div>
{% empty %}
<div class="card">
    <p style="color: #999;">暂无计划，请前往<a href="/admin/" style="color: #667eea;">后台管理</a>添加。</p>
</div>
{% endfor %}
{% endblock %}
