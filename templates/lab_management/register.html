{% extends 'base.html' %}

{% block title %}用户注册{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">创建账号</h1>
        <p class="auth-subtitle">加入实验室管理系统</p>
        
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">用户名 *</label>
                <input type="text" name="username" required class="form-input" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label class="form-label">姓名</label>
                <input type="text" name="first_name" class="form-input" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" name="email" class="form-input" placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label class="form-label">密码 *</label>
                <input type="password" name="password" required class="form-input" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label class="form-label">确认密码 *</label>
                <input type="password" name="password_confirm" required class="form-input" placeholder="请再次输入密码">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">注册</button>
        </form>
        
        <p class="auth-footer">
            已有账号？ <a href="{% url 'login' %}" class="link">立即登录</a>
        </p>
    </div>
</div>
{% endblock %}
