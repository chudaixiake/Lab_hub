{% extends 'base.html' %}
{% load static %}

{% block title %}发布公告 · LabHub{% endblock %}

{% block content %}
<section class="announcements-page">
    <div class="announcements-header">
        <div>
            <h1>发布公告</h1>
            <p>发布实验室重要通知、系统更新与团队动态</p>
        </div>
    </div>

    <div class="announcement-create-card">
        <form method="post" action="{% url 'add_announcement' %}" class="announcement-create-form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{% url 'announcement_list' %}">
            
            <div class="form-group">
                <label for="id_title">公告标题 <span class="required">*</span></label>
                <input type="text" id="id_title" name="title" required class="form-input" placeholder="请输入公告标题...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="id_category">公告类型 <span class="required">*</span></label>
                    <select id="id_category" name="category" class="form-input">
                        <option value="system">系统公告</option>
                        <option value="academic">学术通知</option>
                        <option value="team">团队动态</option>
                        <option value="important">重要通知</option>
                    </select>
                </div>
                
                {% if user.is_superuser %}
                <div class="form-group checkbox-group">
                    <label class="check-line">
                        <input type="checkbox" name="is_pinned">
                        <span>置顶公告</span>
                    </label>
                </div>
                {% endif %}
                
                <div class="form-group checkbox-group">
                    <label class="check-line">
                        <input type="checkbox" name="comments_enabled" checked>
                        <span>开启评论</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="id_content">公告内容 <span class="required">*</span></label>
                <textarea id="id_content" name="content" rows="10" required class="form-input" placeholder="请输入公告内容..."></textarea>
                <small class="form-help">支持纯文本格式，建议简明扼要地描述公告内容</small>
            </div>

            <div class="form-actions">
                <a href="{% url 'announcement_list' %}" class="btn btn-secondary">取消</a>
                <button type="submit" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" style="width:18px;height:18px;display:inline-block;vertical-align:middle;margin-right:6px;">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    发布公告
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
