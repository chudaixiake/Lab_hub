{% extends 'base.html' %}

{% block title %}编辑计划{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">编辑计划</h1>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">日期</label>
                <input type="date" name="date" value="{{ plan.date|date:'Y-m-d' }}" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">计划内容</label>
                <textarea name="content" rows="4" required class="form-input">{{ plan.content }}</textarea>
            </div>
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="is_completed" {% if plan.is_completed %}checked{% endif %}>
                    <span>已完成</span>
                </label>
            </div>
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="is_public" {% if plan.is_public %}checked{% endif %}>
                    <span>公开（公开后其他成员可在总览中查看）</span>
                </label>
            </div>
            <div style="display: flex; gap: 12px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">保存</button>
                <a href="{% url 'my_page' %}" class="btn btn-secondary" style="flex: 1; text-align: center;">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
